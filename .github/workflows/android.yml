name: Android

# Cross-compiles the mirage-ffi Rust core to Android .so libraries and builds a
# debug APK for the Kotlin VpnService client under android/.
# Download the APK from the run's "Artifacts" section.

on:
  push:
    branches: ["android-app"]
    paths:
      - "android/**"
      - "mirage-ffi/**"
      - "mirage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "mirage-ffi/**"
      - "mirage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "26.3.11579264"

jobs:
  # Host-side checks for the Rust pieces the app depends on: the config
  # serialize/parse round-trip and the server's access-link generator.
  host-checks:
    name: Rust checks (config + server CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake golang nasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-checks

      - name: Build server CLI
        run: cargo build -p mirage --bins

      - name: Test config round-trip and access links
        run: cargo test -p mirage --lib -- config share_link

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK to Releases
    steps:
      - uses: actions/checkout@v4

      # BoringSSL (the `boring` crate) is built from source via cmake; it needs
      # a C/C++ toolchain, Go, and nasm — same deps as the desktop CI build.
      - name: Install BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake golang nasm

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ffi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' avoids the action's default attempt to install the obsolete
      # "tools" package, which no longer exists and fails the step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile mirage-ffi for Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 24 \
            -o android/app/src/main/jniLibs \
            build --release -p mirage-ffi

      - name: Verify .so outputs
        run: |
          echo "jniLibs contents:"
          find android/app/src/main/jniLibs -name '*.so' -print

      # The repo ships the wrapper scripts + gradle-wrapper.properties but not the
      # binary gradle-wrapper.jar; regenerate it with the runner's preinstalled Gradle.
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirage-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the APK to the repo's Releases page as a rolling "android-debug"
      # pre-release. Runs only on branch pushes (not PRs), and only if the build
      # above succeeded. Each successful build updates the same release asset.
      - name: Publish APK to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Mirage Android (debug)
          prerelease: true
          body: |
            Automated **debug** build of the Mirage Android client, built from the
            `android-app` branch by CI.

            - Commit: ${{ github.sha }}
            - This APK is a debug build (unsigned for release) — for testing only.

            Download `app-debug.apk` below and install with `adb install app-debug.apk`.
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
